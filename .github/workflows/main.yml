
name: Gerar APK Loto Mania Campeão V11

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LOTO_MANIA_CAMPEAO_V11_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
